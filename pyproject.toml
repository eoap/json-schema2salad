[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "json-schema2salad"
dynamic = ["version"]
description = 'A simple CLI tool to convert JSON Schema instances to Salad schemas'
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [
  { name = "Terradue", email = "simone.tripodi@terradue.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "click==8.3.1",
  "httpx==0.28.1",
  "jsonref==1.1.0",
  "jsonpointer==3.0.0",
  "loguru==0.7.3",
  "pydantic==2.13.3",
  "typing_extensions>=4.0",
  "PyYAML==6.0.3"
]

[project.urls]
Documentation = "https://github.com/Terradue/json-schema2salad#readme"
Issues = "https://github.com/Terradue/json-schema2salad/issues"
Source = "https://github.com/Terradue/json-schema2salad"

[project.scripts]
json-schema2salad = "json_schema2salad.cli:main"

[tool.hatch.version]
path = "src/json_schema2salad/__about__.py"

[tool.coverage.run]
source_pkgs = ["json_schema2salad", "tests"]
branch = true
parallel = true
omit = [
  "src/json_schema2salad/__about__.py",
]

[tool.coverage.paths]
json_schema2salad = ["src/json_schema2salad", "*/json-schema2salad/src/json_schema2salad"]
tests = ["tests", "*/json-schema2salad/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.hatch.envs.dev]
skip-install = false
dependencies = [
  "mypy>=2.3.0",
  "ruff>=0.16.0",
  "bandit>=1.9.4",
]

[tool.ruff]
extend-exclude = ["**/templates/**"]

[tool.ruff.lint]
# Start with the essential rules
select = [
  "F",    # Pyflakes (Critical for bugs)
  "E",    # pycodestyle Errors
  "W",    # pycodestyle Warnings
  "I",    # isort (Import sorting)
  "UP",   # pyupgrade (Modern syntax)
  "B",    # flake8-bugbear (Common bugs)
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "FA",   # flake8-future-annotations
  "TC",   # flake8-type-checking
  "PTH",  # flake8-use-pathlib
  "RET",  # flake8-return
  "C90",  # McCabe Complexity (Enables C901)
]

# Ignore rules that conflict with the formatter (Ruff Format/Black)
ignore = [
  "E501", # Line too long (handled by formatter)
  "W191", # Tab indentation (handled by formatter)
  "E111", # Indentation issues (handled by formatter)
  "E114", # Indentation issues (handled by formatter)
  "E117", # Over-indented (handled by formatter)
]

[tool.ruff.lint.mccabe]
# Flag errors (C901) whenever complexity exceeds 10 (default is 10)
max-complexity = 10

[tool.mypy]
# Jinja templates only become valid Python after cwl2click renders them.
exclude = ["^src/cwl2click/templates/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_missing_imports = true
disable_error_code = ["arg-type", "call-arg", "exit-return", "union-attr"]

[tool.hatch.envs.dev.scripts]
typecheck = "mypy --install-types --non-interactive {args:src tests}"
lint = "ruff format {args:src tests}"
check = "ruff check --fix {args:src tests}"
security = "bandit -r {args:src}"

[tool.hatch.envs.test]
skip-install = false
dependencies = [
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
]

[tool.hatch.envs.test.scripts]
test = "pytest {args:tests}"
testv = "pytest --verbose {args:tests}"
test-cov = "pytest --cov=json_schema2salad --cov-report=term-missing {args:tests}"
test-show-setup = "pytest --setup-show"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
]

[[tool.hatch.envs.test.matrix]]
python = ["3.10", "3.11", "3.12", "3.13", "3.14"]
